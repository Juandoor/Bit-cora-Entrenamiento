<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    /* ===== PALETA — "taller de entrenamiento" =====
       Fondo verde-carbón (no negro puro, menos fatiga visual de uso diario/nocturno).
       Coral cálido = acción/energía. Teal = técnica/foco. Ladrillo = prioridad.
       Hueso cálido en vez de blanco puro para el texto. */
    --bg:        #15201C;
    --surface:   #1E2B25;
    --surface-2: #243730;
    --surface-3: #2C423A;
    --line:      #3A5048;
    --line-soft: #2C3E37;

    --text:      #EDE6D6;
    --text-soft: #8FA39A;
    --text-dim:  #5E7268;

    --coral:     #E8714A;
    --coral-soft:#3A2A22;
    --teal:      #4FA3A3;
    --teal-soft: #1F3838;
    --brick:     #D14F3D;
    --brick-soft:#3A2420;
    --gold:      #D9A24B;
    --gold-vivid: #F4C13D;
    --gold-vivid-soft: rgba(244,193,61,0.10);
    --plum:      #A78BDB;
    --plum-soft: #2A2340;
    --violet:    #A98FD6;
    --violet-soft: rgba(169,143,214,0.14);
    --sage:      #8FA86B;
    --sage-soft: rgba(143,168,107,0.14);
    --rose:      #D68FA8;
    --rose-soft: rgba(214,143,168,0.14);

    --font-display: 'Georgia', 'Spectral', serif;
    --font-body: -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Consolas', monospace;
    --font-meta: 'Inter', -apple-system, 'Segoe UI', sans-serif;

    --radius: 6px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 80px;
  }

  /* ===== FONDO AMBIENTE — capa decorativa fija detrás de todo =====
     Solo se ve en los márgenes, huecos entre paneles y detrás del panel
     del Muro (que no tiene padding). Nunca se ve "a través" de un panel,
     tarjeta, portada o avatar: todos esos tienen su propio fondo sólido
     encima. Usa los mismos acentos de fase que el resto de la app, a muy
     baja opacidad para no competir con el contenido. z-index:-1 la deja
     siempre detrás de todo lo demás (que no declara z-index negativo). */
  body::before{
    content:"";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 8% 4%, rgba(232,113,74,0.20), transparent 38%),
      radial-gradient(circle at 94% 8%, rgba(79,163,163,0.18), transparent 42%),
      radial-gradient(circle at 26% 96%, rgba(167,139,219,0.16), transparent 46%),
      radial-gradient(circle at 84% 82%, rgba(217,162,75,0.14), transparent 42%);
  }
  /* Retícula fina tipo "plano técnico de taller", se desvanece hacia abajo */
  body::after{
    content:"";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(237,230,214,0.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(237,230,214,0.075) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 88%);
    mask-image: linear-gradient(180deg, #000 0%, transparent 88%);
  }

  ::selection{ background: var(--coral); color: var(--bg); }

  /* ===== HEADER ===== */
  .masthead{
    background: linear-gradient(160deg, #101a16, #182621 60%, #1a2d26);
    color: var(--text);
    padding: 28px 24px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .masthead-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    max-width: 1040px; margin:0 auto;
  }
  .masthead h1{
    font-family: var(--font-display);
    font-size: clamp(26px, 4.5vw, 38px);
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .masthead .sub{
    font-size: 12px;
    color: var(--coral);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight:600;
  }
  .masthead .meta{
    text-align:right;
    font-family: var(--font-meta);
    font-size: 12px;
    color: var(--text-soft);
    line-height:1.8;
  }
  .masthead .meta b{ color: var(--text); font-weight:600; }
  .masthead .meta #cycleName{ color: var(--coral); }

  .drive-sync-widget{
    margin-top:10px;
    display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap;
  }
  .drive-sync-status{
    font-size:11px;
    color: var(--text-dim);
    letter-spacing:0.01em;
  }
  .drive-sync-status.ok{ color: var(--teal); }
  .drive-sync-status.warn{ color: var(--gold-vivid); }
  .drive-sync-status.err{ color: var(--brick); }
  .drive-sync-btn{
    font-family: var(--font-body);
    font-size: 11px;
    font-weight:700;
    padding: 4px 11px;
    border-radius: 20px;
    border: 1px solid var(--teal);
    background: var(--teal-soft);
    color: #8FD4D4;
    cursor:pointer;
    transition: opacity .15s;
  }
  .drive-sync-btn:hover{ opacity:0.8; }
  .drive-sync-btn.secondary{
    border-color: var(--line);
    background: transparent;
    color: var(--text-soft);
  }

  .tabs{
    max-width: 1040px; margin: 20px auto 0;
    display:flex; gap:4px; flex-wrap:wrap;
  }
  .tab-btn{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 7px 7px 0 0;
    border:none;
    background: transparent;
    color: var(--text-soft);
    cursor:pointer;
    transition: background .15s, color .15s;
    letter-spacing:0.01em;
  }
  .tab-btn:hover{ background: rgba(255,255,255,0.04); color: var(--text); }
  .tab-btn.active{ background: var(--surface); color: var(--text); }

  /* ===== LAYOUT ===== */
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 24px 24px 0; }
  .view{ display:none; }
  .view.active{ display:block; }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }

  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .panel-head h2{
    font-family: var(--font-display);
    font-size: 19px;
    margin:0;
    font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .panel-head .count{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--teal);
    background: var(--teal-soft);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .panel-body{ padding: 18px 20px 20px; }

  /* ===== EDITABLE ===== */
  [contenteditable="true"]{
    outline: none;
    border-radius: 3px;
    transition: background .12s;
  }
  [contenteditable="true"]:hover{ background: rgba(232,113,74,0.12); cursor: text; }
  [contenteditable="true"]:focus{
    background: var(--surface-3);
    box-shadow: 0 0 0 2px var(--coral);
  }
  [contenteditable="true"]:empty:before{
    content: attr(data-placeholder);
    color: var(--text-dim);
    font-style: italic;
  }

  /* ===== ZONA DE FONDO detrás de las tarjetas de ejercicios =====
     Contenedor recesado (más oscuro que el panel) para que las tarjetas
     de cada ejercicio floten con contraste sobre este fondo propio. */
  .ex-list{
    background: var(--bg);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 14px;
  }

  /* ===== FASE DIVIDER (separador de bloque fisiológico dentro de cada rutina) ===== */
  .fase-divider{
    display:flex; align-items:center; gap:10px;
    margin: 22px 0 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  .fase-divider:first-child{ margin-top:0; }
  .fase-divider::after{ content:""; flex:1; height:1px; background: var(--line-soft); }
  .fase-divider .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .fase-divider.activacion .dot{ background: var(--teal); }
  .fase-divider.correctivo .dot{ background: var(--sage); }
  .fase-divider.fuerza .dot{ background: var(--coral); }
  .fase-divider.hipertrofia .dot{ background: var(--violet); }
  .fase-divider.pliometria .dot{ background: var(--gold); }
  .fase-divider.cardio .dot{ background: #6BA3D6; }
  .fase-divider.isometricos .dot{ background: var(--brick); }
  .fase-divider.estiramiento .dot{ background: var(--rose); }
  .fase-divider.accesorio .dot{ background: var(--text-dim); }

  /* ===== EXERCISE CARD ===== */
  .ex-card{
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--teal);
    border-radius: 5px;
    margin-bottom: 12px;
    background: var(--surface-2);
    position: relative;
    overflow: hidden;
  }
  .ex-card.priority{ border-left-color: var(--brick); }
  .ex-card.cardio{ border-left-color: #6BA3D6; }

  .ex-top{
    display:flex; align-items:flex-start; gap:11px;
    padding: 13px 14px 10px;
  }
  .ex-num{
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight:700;
    color: var(--text-soft);
    background: var(--surface-3);
    border: 1px solid var(--line);
    width: 24px; height:24px;
    border-radius: 6px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    margin-top: 2px;
  }
  .ex-title{
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    flex:1;
    padding: 2px 4px;
    color: var(--text);
  }
  .ex-tag{
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight:700;
    white-space:nowrap;
    margin-top:3px;
    cursor:pointer;
    border:none;
  }
  .ex-tag.priority{ background: var(--brick-soft); color: #F0A296; }
  .ex-tag.cardio{ background: #1c2e3c; color:#9CC4E8; }
  .ex-tag.normal{ background: var(--teal-soft); color: #8FD4D4; }

  .ex-del{
    background:none; border:none; color: var(--text-dim); cursor:pointer;
    font-size:18px; line-height:1; padding:2px 6px; border-radius:4px;
    transition: color .15s, background .15s;
  }
  .ex-del:hover{ color: var(--brick); background: var(--brick-soft); }

  .ex-stats{
    display:flex; flex-wrap:wrap; gap:7px;
    padding: 0 14px 12px;
  }
  .stat{
    background: var(--surface-3);
    border-radius: 5px;
    padding: 5px 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    display:flex; flex-direction:column;
    min-width: 56px;
  }
  .stat label{
    font-size: 8.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-weight:700;
    margin-bottom:1px;
  }
  .stat .val{ font-weight:600; }

  /* ===== NOTAS — cuatro pestañas satélite en grilla 2×2, cada una con su panel expandible =====
     Antes iban las 4 forzadas en una sola fila (flex:1 + nowrap + ellipsis), lo que
     apretaba el texto hasta que las palabras se pisaban/juntaban en pantallas angostas.
     Ahora cada pestaña ocupa 50% de ancho (2 filas de 2), con espacio real para el texto. */
  .ex-notes-row{
    display:flex;
    flex-wrap: wrap;
    border-top: 1px solid var(--line-soft);
  }
  .ex-notes-toggle{
    flex: 1 1 50%;
    max-width: 50%;
    box-sizing: border-box;
    display:flex; align-items:center; gap:7px;
    padding: 9px 12px;
    background: rgba(0,0,0,0.12);
    cursor:pointer;
    font-size: 12px;
    color: var(--gold);
    font-weight:600;
    user-select:none;
    min-width:0;
  }
  .ex-notes-toggle span:last-child{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ex-notes-toggle:nth-child(odd){ border-right: 1px solid var(--line-soft); }
  .ex-notes-toggle:nth-child(-n+2){ border-bottom: 1px solid var(--line-soft); }
  .ex-notes-toggle:hover{ background: rgba(0,0,0,0.2); }
  .ex-notes-toggle.aclaracion{ color: var(--gold-vivid); }
  .ex-notes-toggle.aclaracion:hover{ background: var(--gold-vivid-soft); }
  .ex-notes-toggle .chevron{ transition: transform .15s; font-size:10px; }
  .ex-notes-toggle.open .chevron{ transform: rotate(90deg); }
  /* Quinta pestaña satélite condicional (Subtipo isométrico / Tipo de estiramiento):
     ocupa la fila completa para no dejar una tarjeta a medio ancho con un borde
     apuntando a la nada. */
  .ex-notes-toggle.full{
    flex-basis: 100%;
    max-width: 100%;
    border-right: none !important;
    border-top: 1px solid var(--line-soft);
  }
  .ex-notes-toggle.isotipo{ color: var(--brick); }
  .ex-notes-toggle.isotipo:hover{ background: var(--brick-soft); }
  .ex-notes-panel.isotipo{ border-top: 1px dashed var(--brick); background: var(--brick-soft); }
  .ex-notes-toggle.estiratipo{ color: var(--rose); }
  .ex-notes-toggle.estiratipo:hover{ background: var(--rose-soft); }
  .ex-notes-panel.estiratipo{ border-top: 1px dashed var(--rose); background: var(--rose-soft); }
  .ex-notes-panel .subtipo-def{ margin:10px 0 0; font-size:12.5px; color: var(--text-soft); line-height:1.5; }
  .ex-notes-panel .subtipo-select{ width:auto; min-width:220px; }
  .ex-notes-panel{
    display:none;
    padding: 12px 14px 14px;
    background: rgba(0,0,0,0.18);
    border-top: 1px dashed var(--line);
    font-size: 13px;
    color: var(--text-soft);
  }
  .ex-notes-panel.aclaracion{
    border-top: 1px dashed var(--gold-vivid);
    background: var(--gold-vivid-soft);
  }
  .ex-notes-panel.open{ display:block; }
  .ex-notes-panel [contenteditable]{ color: var(--text-soft); }

  .add-ex-btn{
    width:100%;
    padding: 12px;
    border: 1.5px dashed var(--line);
    background: transparent;
    border-radius: var(--radius);
    color: var(--text-soft);
    font-family: var(--font-body);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .add-ex-btn:hover{ border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

  /* select de fase, dentro de cada tarjeta */
  .fase-select{
    font-family: var(--font-mono);
    font-size: 10.5px;
    background: var(--surface-3);
    color: var(--text-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 3px;
  }

  /* ===== TECHNIQUE BLOCK ===== */
  .rule-list{ list-style:none; padding:0; margin: 0 0 14px; }
  .rule-list li{
    padding: 8px 0 8px 26px;
    position: relative;
    font-size: 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .rule-list li:last-child{ border-bottom:none; }
  .rule-list.good li::before{ content:"✓"; position:absolute; left:0; color: var(--teal); font-weight:700; }
  .rule-list.bad li::before{ content:"✕"; position:absolute; left:0; color: var(--brick); font-weight:700; }

  .callout{
    background: var(--brick-soft);
    border-left: 3px solid var(--brick);
    border-radius: 3px;
    padding: 13px 15px;
    font-size: 13.5px;
    margin-bottom: 14px;
    color: var(--text);
  }
  .callout b{ color: #F0A296; }
  .callout.gold{ background: #2e2616; border-left-color: var(--gold); }
  .callout.gold b{ color:var(--gold); }
  .callout.teal{ background: var(--teal-soft); border-left-color: var(--teal); }
  .callout.teal b{ color: #8FD4D4; }

  /* ===== DAILY LOG ===== */
  .log-entry{
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    margin-bottom: 14px;
    background: var(--surface-2);
  }
  .log-entry-head{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 16px;
    background: var(--surface-3);
    border-radius: 5px 5px 0 0;
  }
  .log-date{
    font-family: var(--font-mono);
    font-weight:700;
    font-size: 14px;
    color: var(--text);
  }
  .log-type-badge{
    font-size:10px; text-transform:uppercase; letter-spacing:0.07em;
    background: var(--coral); color: #1a0f0a;
    padding:3px 9px; border-radius:20px; font-weight:700;
  }
  .log-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap: 10px;
    padding: 14px 16px;
  }
  .log-field label{
    font-size: 10px; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--text-dim); font-weight:700; display:block; margin-bottom:4px;
  }
  .log-field .v{
    font-size: 14px; padding: 6px 8px; background: var(--surface-3); border-radius:4px; min-height:20px;
    color: var(--text);
  }
  .log-notes{
    padding: 0 16px 16px;
    font-size: 13.5px;
    color: var(--text-soft);
  }
  .log-notes .v{ background: var(--surface-3); border-radius:4px; padding:8px 10px; margin-top:4px; }

  .scale-row{ display:flex; gap:4px; margin-top:2px; }
  .scale-dot{
    width:22px; height:22px; border-radius:50%;
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; cursor:pointer; font-family:var(--font-mono);
    background: var(--surface-2); color: var(--text-soft);
    transition: all .12s;
  }
  .scale-dot.active{ background: var(--coral); color: #1a0f0a; border-color: var(--coral); }

  /* ===== FORM ===== */
  .form-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap:14px; margin-bottom:16px;
  }
  .form-field label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-dim); font-weight:700; display:block; margin-bottom:5px;
  }
  .form-field input, .form-field select, .form-field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:var(--font-body); font-size:13.5px; background: var(--surface-2); color:var(--text);
  }
  .form-field textarea{ resize:vertical; min-height:60px; }
  .form-field input::placeholder, .form-field textarea::placeholder{ color: var(--text-dim); }

  .primary-btn{
    background: var(--coral); color:#1a0f0a; border:none;
    padding: 10px 22px; border-radius:5px; font-weight:700; font-size:13.5px;
    cursor:pointer; font-family:var(--font-body);
    transition: opacity .15s;
  }
  .primary-btn:hover{ opacity:0.88; }
  .secondary-btn{
    background:transparent; color:var(--text-soft); border:1px solid var(--line);
    padding:9px 18px; border-radius:5px; font-weight:600; font-size:13px; cursor:pointer;
    font-family: var(--font-body);
  }
  .secondary-btn:hover{ background: var(--surface-3); }

  /* ===== WEEKLY SUMMARY ===== */
  .week-card{
    border:1px solid var(--line-soft); border-radius:var(--radius); background: var(--surface-2); margin-bottom:14px;
  }
  .week-card-head{
    padding:12px 16px; border-bottom:1px solid var(--line-soft);
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-display); font-weight:600; font-size:16px;
  }
  .week-card-body{ padding:14px 16px; }
  .week-stat-row{ display:flex; gap:18px; margin-bottom:12px; flex-wrap:wrap; }
  .week-stat{ text-align:center; }
  .week-stat .num{ font-family:var(--font-mono); font-size:24px; font-weight:700; color: var(--coral); }
  .week-stat .lbl{ font-size:10px; text-transform:uppercase; color:var(--text-dim); letter-spacing:0.05em; }

  /* ===== EMPTY STATE ===== */
  .empty-state{
    text-align:center; padding: 40px 20px; color: var(--text-dim);
  }
  .empty-state .icon{
    width:52px; height:52px; margin: 0 auto 10px;
    border-radius: 14px;
    background: var(--surface-3);
    border: 1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
  }
  .empty-state .icon svg{ width:24px; height:24px; }

  /* ===== FOOTER BAR ===== */
  .floatbar{
    position:fixed; bottom:0; left:0; right:0;
    background: #0E1612; color: var(--text-soft);
    padding: 10px 24px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px;
    z-index:50;
    border-top: 1px solid var(--line-soft);
  }
  .floatbar .right{ display:flex; gap:8px; }
  .floatbar button{
    background: var(--surface-3); border:none; color: var(--text);
    padding:7px 14px; border-radius:5px; font-size:12px; font-weight:600; cursor:pointer;
    font-family: var(--font-body);
  }
  .floatbar button:hover{ background: var(--surface-3); filter:brightness(1.3); }

  .saved-flash{
    position:fixed; top:16px; right:16px;
    background: var(--coral); color:#1a0f0a; padding:8px 16px; border-radius:5px;
    font-size:12px; font-weight:700; opacity:0; transition: opacity .25s; z-index:100;
    pointer-events:none;
  }
  .saved-flash.show{ opacity:1; }

  /* ===== LEYENDA DE FASES — fondo propio con diseño, cada fase como chip ===== */
  .fase-legend{
    display:flex; gap:8px; flex-wrap:wrap;
    padding: 11px 13px;
    margin: 2px 0 16px;
    background: linear-gradient(135deg, var(--surface-2), var(--surface-3) 60%, var(--surface-2));
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    font-size: 11.5px; color: var(--text-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .fase-legend span{
    display:flex; align-items:center; gap:6px;
    padding: 5px 11px 5px 8px;
    border-radius: 20px;
    background: rgba(0,0,0,0.16);
    border: 1px solid var(--line-soft);
    transition: border-color .15s, background .15s;
  }
  .fase-legend .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  @media (max-width:640px){
    .masthead-row{ flex-direction:column; gap:6px; }
    .masthead .meta{ text-align:left; }
    .wrap{ padding: 18px 14px 0; }
    .log-grid{ grid-template-columns: 1fr 1fr; }
  }

  /* ===== Pantallas 720p (1280×720 / 1366×768, y similares de poca altura) =====
     Se compactan paddings/márgenes verticales para aprovechar mejor el alto
     disponible sin recortar contenido ni forzar scroll excesivo. */
  @media (max-height:760px){
    .masthead{ padding: 16px 24px 0; }
    .masthead h1{ font-size: clamp(21px, 3.4vw, 28px); margin-bottom: 2px; }
    .tabs{ margin: 12px auto 0; }
    .tab-btn{ padding: 8px 14px; font-size:12.5px; }
    .wrap{ padding: 16px 24px 0; }
    .panel{ margin-bottom: 14px; }
    .panel-head{ padding: 10px 18px; }
    .panel-head h2{ font-size: 17px; }
    .panel-body{ padding: 14px 18px 15px; }
    .fase-divider{ margin: 16px 0 9px; }
    .ex-card{ margin-bottom: 9px; }
    .ex-top{ padding: 10px 14px 8px; }
    .ex-stats{ padding: 0 14px 9px; gap:6px; }
    .ex-notes-toggle{ padding: 7px 14px; }
    .ex-notes-panel{ padding: 9px 14px 11px; }
    body{ padding-bottom: 64px; }
    .floatbar{ padding: 7px 24px; }
  }

  @media (max-width:1366px) and (max-height:800px){
    .wrap, .masthead-row, .tabs{ max-width: 980px; }
  }

  /* ===== VIDEO LINKS (panel "satélite" por tarjeta) ===== */
  .ex-notes-toggle.video{ color: var(--plum); }
  .ex-notes-toggle.video:hover{ background: var(--plum-soft); }
  .ex-notes-panel.video{ border-top: 1px dashed var(--plum); background: var(--plum-soft); }
  .video-links{ display:flex; flex-direction:column; gap:6px; }
  .video-link-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background: rgba(0,0,0,0.18); border-radius:4px; padding:6px 10px;
  }
  .video-link-row a{ color: var(--plum); font-size:13px; text-decoration:none; word-break:break-all; display:inline-flex; align-items:center; gap:6px; }
  .video-link-row a svg{ width:13px; height:13px; flex-shrink:0; }
  .video-link-row a:hover{ text-decoration:underline; }
  .video-link-del{
    background:none; border:none; color: var(--text-dim); cursor:pointer;
    font-size:16px; line-height:1; padding:0 4px; flex-shrink:0;
  }
  .video-link-del:hover{ color: var(--brick); }
  .muro-btn{
    font-family: var(--font-body); font-size:12px; font-weight:600;
    padding:6px 12px; border-radius:5px; border:1px solid var(--plum);
    background:transparent; color: var(--plum); cursor:pointer;
    transition: background .15s;
  }
  .muro-btn:hover{ background: var(--plum-soft); }

  /* ===== MURO ===== */
  .muro-cover{
    position:relative;
    width:100%;
    aspect-ratio: 16 / 5;
    min-height: 160px;
    cursor: default;
    border-bottom: 1px solid var(--line-soft);
    /* overflow visible a propósito: el avatar sobresale del marco.
       Lo que sí debe recortarse (foto + fondo decorativo) va en
       .muro-cover-media, una capa interna aparte. */
  }
  .muro-cover.has-img{ cursor: zoom-in; }
  /* Franja superior de acento, en el espectro de colores de fase de la app */
  .muro-cover::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--coral), var(--gold-vivid), var(--teal), var(--plum));
    z-index:3;
  }
  /* Viñeta inferior: aporta contraste bajo el avatar y los botones */
  .muro-cover::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:72px;
    background: linear-gradient(transparent, rgba(10,14,12,0.5));
    pointer-events:none;
    z-index:2;
  }
  .muro-cover-media{
    position:absolute; inset:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 12% 18%, rgba(232,113,74,0.20), transparent 42%),
      radial-gradient(circle at 88% 15%, rgba(79,163,163,0.20), transparent 46%),
      radial-gradient(circle at 55% 105%, rgba(167,139,219,0.18), transparent 55%),
      linear-gradient(135deg, var(--surface-2), var(--surface-3));
  }
  /* Textura sutil de líneas diagonales, queda debajo de la foto si hay una */
  .muro-cover-media::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 15px);
    pointer-events:none;
  }
  .muro-cover-media img{
    position:relative; z-index:1;
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .muro-cover-empty{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    color: var(--text-dim);
  }
  .muro-cover-empty-icon{
    width:44px; height:44px; border-radius:12px;
    background: var(--plum-soft);
    border: 1.5px dashed rgba(167,139,219,0.45);
    display:flex; align-items:center; justify-content:center;
    color: var(--plum);
    opacity:0.9;
  }
  .muro-cover-empty-icon svg{ width:20px; height:20px; }
  .muro-cover-empty-text{ font-size:13px; font-style:italic; }
  .muro-avatar-wrap{
    position:absolute; left:20px; bottom:-34px;
    z-index:5;
  }
  .muro-avatar{
    width:88px; height:88px; border-radius:50%;
    border:3px solid var(--surface);
    box-shadow: 0 0 0 2px var(--plum), 0 4px 14px rgba(0,0,0,0.4);
    background: var(--surface-3);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); font-size:22px;
    cursor:pointer;
    transition: box-shadow .15s;
  }
  .muro-avatar:hover{ box-shadow: 0 0 0 2px var(--coral), 0 4px 14px rgba(0,0,0,0.45); }
  .muro-avatar img{ width:100%; height:100%; object-fit:cover; }
  .muro-cover-actions{
    position:absolute; right:14px; bottom:14px;
    display:flex; gap:8px;
    z-index:5;
  }
  .muro-cover-actions .muro-btn{
    background: rgba(21,32,28,0.75); backdrop-filter: blur(2px);
    color: var(--text); border-color: var(--line);
  }
  .muro-cover-actions .muro-btn:hover{ background: rgba(21,32,28,0.92); }
  .muro-modal{
    display:none; position:fixed; inset:0; z-index:200;
    background: rgba(10,14,12,0.92);
    align-items:center; justify-content:center;
    cursor: zoom-out;
    padding: 30px;
  }
  .muro-modal.open{ display:flex; }
  .muro-modal img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }


  /* ===== EXTRA STATS (Time Work / Metrónomo) — barras anchas, apiladas ===== */
  .ex-stats-extra{
    display:flex; flex-direction:column; gap:8px;
    padding: 0 14px 12px;
  }
  .stat-wide{
    display:flex; align-items:center; gap:12px;
    background: var(--surface-3);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 9px 14px;
  }
  .stat-wide-icon{
    flex-shrink:0;
    width: 28px; height:28px;
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
  }
  .stat-wide-icon svg{ width:15px; height:15px; }
  .stat-wide-body{
    flex:1; min-width:0;
    display:flex; flex-direction:column;
  }
  .stat-wide-body label{
    font-size: 9px;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-weight:700;
    margin-bottom:2px;
  }
  .stat-wide .val{
    font-weight:700; font-size:14px;
    font-family: var(--font-mono);
    color: var(--text);
  }
  /* Time Work: color propio para distinguirlo del metrónomo */
  .stat-tiempowork{
    background: var(--gold-vivid-soft);
    border-color: rgba(244,193,61,0.35);
  }
  .stat-tiempowork .stat-wide-icon{ color: var(--gold-vivid); background: var(--gold-vivid-soft); border-color: rgba(244,193,61,0.35); }
  .stat-metro .stat-wide-icon{ color: var(--teal); background: var(--teal-soft); border-color: rgba(79,163,163,0.4); }
  .stat-tiempowork .val{ color: var(--gold-vivid); }
  /* Metrónomo: dos campos lado a lado dentro de la misma barra */
  .stat-metro-body{ flex-direction:row; align-items:flex-end; gap:16px; }
  .stat-metro-field{ display:flex; flex-direction:column; }
  .stat-metro-field label{
    font-size: 9px; text-transform:uppercase; letter-spacing:0.07em;
    color: var(--text-dim); font-family: var(--font-body); font-weight:700; margin-bottom:2px;
  }
  .stat-metro-field span[contenteditable]{
    font-weight:700; font-size:14px; font-family: var(--font-mono); color: var(--gold-vivid);
  }
  .stat-metro .metro-x{ color: var(--text-dim); font-weight:700; padding-bottom:1px; }
  .stat-wide .stat-quitar{
    flex-shrink:0; margin-left:auto;
    background:none; border:none; color: var(--text-dim);
    font-size:10px; text-transform:uppercase; letter-spacing:0.05em;
    cursor:pointer; padding:2px 4px; font-family:var(--font-body); font-weight:700;
  }
  .stat-wide .stat-quitar:hover{ color: var(--brick); }
  .stat-add-btn-wide{
    width:100%; text-align:left;
    font-family: var(--font-body); font-size:12px; font-weight:600;
    padding:9px 14px; border-radius:8px; border:1.5px dashed var(--line);
    background:transparent; color: var(--text-dim); cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .stat-add-btn-wide:hover{ border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

  /* ===== REGLAS DE PROGRESIONES (toggle extra en tarjeta) ===== */
  .ex-notes-toggle.progresion{ color: #8FD4A0; }
  .ex-notes-toggle.progresion:hover{ background: rgba(143,212,160,0.08); }
  .ex-notes-panel.progresion{ border-top: 1px dashed #8FD4A0; background: rgba(143,212,160,0.06); }

  /* ===== VIDEO EMBEDS dentro del panel satélite ===== */
  .video-embed{ margin-top:8px; border-radius:5px; overflow:hidden; background:#000; }
  .video-embed iframe{ width:100%; aspect-ratio:16/9; border:none; display:block; }
  .video-embed video{ width:100%; max-height:360px; display:block; }
  .video-embed-note{ margin-top:6px; font-size:11.5px; color: var(--text-dim); font-style:italic; }
  .instagram-media, .tiktok-embed{ max-width:100% !important; margin-top:8px !important; }

  /* ===== MURO — diseño distintivo del panel-head (ícono + acento violeta) ===== */
  .muro-panel-head{
    background: linear-gradient(120deg, var(--plum-soft) 0%, transparent 65%);
    border-bottom: 1px solid rgba(167,139,219,0.32);
  }
  .muro-panel-icon{
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--plum-soft);
    border: 1px solid rgba(167,139,219,0.45);
    color: var(--plum);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .muro-panel-icon svg{ width:16px; height:16px; }

  /* ===== MURO — píldora "Sin comprimir" junto al título, en el panel-head ===== */
  .muro-compress-toggle{
    position: relative;
    display:flex; align-items:center; gap:6px;
    background: var(--surface-3);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px 6px 11px;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight:600;
    color: var(--text-soft);
    cursor:pointer;
    user-select:none;
    transition: border-color .15s, color .15s, background .15s;
  }
  .muro-compress-toggle:hover{ border-color: var(--coral); color: var(--text); }
  .muro-compress-toggle input{ position:absolute; opacity:0; width:0; height:0; }
  .muro-compress-icon{ display:flex; align-items:center; }
  .muro-compress-icon svg{ width:13px; height:13px; }
  .muro-compress-toggle.active{
    border-color: var(--coral); color: var(--coral);
    background: rgba(232,113,74,0.16);
  }
  /* Animación al hacer click: rebote elástico */
  @keyframes muroTogglePulse{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.14); }
    65%{ transform: scale(0.93); }
    100%{ transform: scale(1); }
  }
  .muro-toggle-pulse{ animation: muroTogglePulse .4s ease; }
  /* Animación al abrir/cargar el Muro: entra deslizando desde la derecha */
  @keyframes muroToggleEnter{
    0%{ opacity:0; transform: translateX(14px) scale(0.85); }
    60%{ opacity:1; transform: translateX(-3px) scale(1.04); }
    100%{ opacity:1; transform: translateX(0) scale(1); }
  }
  .muro-toggle-enter{ animation: muroToggleEnter .5s cubic-bezier(.34,1.56,.64,1) both; }

  /* ===== TRACKER DE CONSTANCIA (dentro de Registro diario) ===== */
  .tracker-header-row{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap;
    gap:12px; margin-bottom:14px;
  }
  .tracker-title{
    font-family: var(--font-display); font-size:17px; font-weight:600; color: var(--text);
  }
  .tracker-meta{
    font-size:11.5px; color: var(--text-dim); font-family: var(--font-mono); margin-top:2px;
  }
  .tracker-pct-wrap{ text-align:right; }
  .tracker-pct{
    font-family: var(--font-mono); font-size:26px; font-weight:700; color: var(--coral); line-height:1;
  }
  .tracker-pct-label{
    font-size:9.5px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;
  }
  .tracker-progress-bar{
    height:9px; background: var(--surface-3); border-radius:6px; overflow:hidden;
    border: 1px solid var(--line-soft);
  }
  .tracker-progress-fill{
    height:100%; background: linear-gradient(90deg, var(--teal), var(--coral));
    border-radius:6px; transition: width .3s ease;
  }
  .tracker-legend{
    display:flex; gap:14px; flex-wrap:wrap; margin: 14px 0 4px;
    font-size: 11.5px; color: var(--text-soft);
  }
  .tracker-legend span{ display:flex; align-items:center; gap:5px; }
  .tracker-legend .dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .tracker-weeks{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .tracker-week-row{ display:flex; align-items:center; gap:10px; }
  .tracker-week-label{
    font-family: var(--font-mono); font-size:10.5px; color: var(--text-dim);
    width:44px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.04em;
  }
  .tracker-days-row{ display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .tracker-day{
    width:38px; height:44px; border-radius:6px;
    background: var(--surface-3); border:1px solid var(--line-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; position:relative;
    font-family: var(--font-mono); color: var(--text-soft);
    transition: transform .12s ease, border-color .12s ease;
  }
  .tracker-day:hover{ transform: translateY(-2px); border-color: var(--teal); }
  .tracker-day .num{ font-size:12.5px; font-weight:700; line-height:1.2; }
  .tracker-day .wd{ font-size:8px; text-transform:uppercase; opacity:0.75; letter-spacing:0.03em; }
  .tracker-day.status-A{ background: var(--coral); border-color: var(--coral); color:#1a0f0a; }
  .tracker-day.status-Descanso{ background: var(--teal); border-color: var(--teal); color:#08201d; }
  .tracker-day.status-Otro{ background: var(--gold-vivid); border-color: var(--gold-vivid); color:#2b2205; }
  .tracker-day.haslog::after{
    content:"●"; position:absolute; top:2px; right:4px; font-size:6px; opacity:0.8;
  }
  .tracker-setup-grid{ margin-bottom: 4px; }
  .tracker-reconfig summary{
    cursor:pointer; color: var(--text-dim); font-size:12px; font-weight:600;
    padding:4px 0;
  }
  .tracker-reconfig summary:hover{ color: var(--text-soft); }
  .tracker-hint{ font-size:12px; color: var(--text-dim); margin-top:10px; }

  @media (max-width:640px){
    .tracker-day{ width:30px; height:38px; }
    .tracker-week-label{ width:36px; font-size:9.5px; }
  }

  @media print{
    .floatbar, .tabs, .add-ex-btn, .ex-del, .ex-notes-row{ display:none !important; }
    .ex-notes-panel{ display:block !important; }
    .view{ display:block !important; }
    body{ background:white; color:#111; }
    .panel, .ex-card{ background:white; border-color:#ccc; }
  }
</style>
</head>

<body>

<div class="saved-flash" id="savedFlash">Guardado ✓</div>

<header class="masthead">
  <div class="masthead-row">
    <div>
      <div class="sub">Bitácora personal · Editable</div>
      <h1 contenteditable="true" data-placeholder="Tu nombre o título del plan">Plan de Entrenamiento</h1>
    </div>
    <div class="meta">
      Inicio: <b contenteditable="true" id="startDate">25 May 2026</b><br>
      Última actualización: <b id="lastUpdate">—</b><br>
      Ciclo actual: <b contenteditable="true" id="cycleName">Fuerza + Core</b>
      <div class="drive-sync-widget" id="driveSyncWidget">
        <span class="drive-sync-status" id="driveSyncStatus">☁️ Google Drive: sin conectar</span>
        <button class="drive-sync-btn" id="driveConnectBtn" onclick="connectDrive()">Conectar</button>
        <button class="drive-sync-btn secondary" id="driveSyncNowBtn" onclick="manualSyncDrive()" style="display:none">Sincronizar ahora</button>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn" data-view="muro">Muro</button>
    <button class="tab-btn active" data-view="rutinaA">Rutina A</button>
    <button class="tab-btn" data-view="rutinaB">Rutina B</button>
    <button class="tab-btn" data-view="calentamiento">Calentamiento / Enfriamiento</button>
    <button class="tab-btn" data-view="tecnica">Técnica y prioridades</button>
    <button class="tab-btn" data-view="registro">Registro diario</button>
    <button class="tab-btn" data-view="semanal">Conclusiones semanales</button>
  </nav>
</header>

<div class="wrap">
  <div class="view" id="view-muro"></div>
  <div class="view active" id="view-rutinaA"></div>
  <div class="view" id="view-rutinaB"></div>
  <div class="view" id="view-calentamiento"></div>
  <div class="view" id="view-tecnica"></div>
  <div class="view" id="view-registro"></div>
  <div class="view" id="view-semanal"></div>
</div>

<div class="floatbar">
  <div class="left">Los cambios se guardan automáticamente en este navegador.</div>
  <div class="right">
    <button onclick="window.print()">Imprimir / Exportar PDF</button>
    <button onclick="exportJSON()">Exportar copia (.json)</button>
    <button onclick="document.getElementById('importFile').click()">Importar copia</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
</div>

<script>
// ============================================================
// DATOS INICIALES — semilla de la app, sincronizada con el JSON
// bitacora_entrenamiento_2026-08-02.json (fuente de verdad).
// Se usa solo si el navegador no tiene ya datos guardados en
// localStorage. Podés editar todo desde la interfaz.
// ============================================================

const DEFAULT_DATA = {
  "meta": {
    "startDate": "27 jun 2026",
    "cycleName": "Fuerza + Core",
    "lastUpdate": "2 de ago de 2026 12:21 a. m."
  },
  "muro": {
    "cover": null,
    "avatar": null,
    "coverAspect": null
  },
  "tracker": null,

      "contenido": "Cada rutina sigue la misma lógica fisiológica, de principio a fin:\n\n1) Activación / core / técnica fina — el sistema nervioso está fresco, así que es el mejor momento para los movimientos que exigen más precisión (Hollow Hold, crunch inverso suspendido, control lumbo-pélvico).\n\n2) Fuerza pesada — compuestos con más carga externa y mayor demanda neural y articular (press, peso muerto, sentadillas, dorsales, remo). Van con energía intacta.\n\n3) Cardio y pliometría — saltos y movimientos explosivos. Van después de la fuerza pesada porque ya activaron el patrón motor, pero antes de los accesorios porque todavía necesitan algo de frescura para mantener la calidad del salto.\n\n4) Accesorios livianos — aislamiento de articulaciones chicas (codo, tobillo) o isométricos de cierre. Van al final porque su fatiga no compromete la técnica de nada que venga después: no hay nada después."

<script>
// ============================================================
// MOTOR DE LA BITÁCORA

const STORAGE_KEY = "bitacora_entrenamiento_v2"; // clave legada de localStorage (para migrar datos viejos una sola vez)
const IDB_NAME = "bitacoraDB";
const IDB_STORE = "kv";
const IDB_KEY = "state";
let STATE = null;

// ---------- IndexedDB helpers ----------
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{
      req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

const FASE_LABELS = {

const ISO_TIPO_LABELS = { superacion:"Superación", sostenimiento:"Sostenimiento", funcional:"Funcional" };
function isoTipoDef(t){
  if(t === "superacion") return "Superación: empuje o tracción máxima contra una resistencia inamovible (pin fijo, pared, barra bloqueada en un rack). No hay desplazamiento articular; el objetivo es la máxima producción de fuerza posible en ese punto.";

  if(t === "funcional") return "Funcional: pausa isométrica en un punto específico de un movimiento dinámico (ej. a mitad de camino de una sentadilla o dominada), para reforzar un rango de movimiento débil o un punto de estancamiento (sticking point).";

}
const ESTIRA_TIPO_LABELS = { activo:"Activo", pasivo:"Pasivo" };
function estiraTipoDef(t){

function setEstiramientoTipo(routineKey, idx, value){

  ex.estiramientoTipo = value;
  if(value && (!ex.notasAclaracion || !ex.notasAclaracion.trim())){

  saveState();
  renderRoutine(routineKey);

// ---------- helpers ----------
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){

  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function flashSaved(){

         d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

// ---------- load / save ----------
async function loadState(){
  // 1) ¿Hay datos ya en IndexedDB?
  try{
    const fromIdb = await idbGet(IDB_KEY);
    if(fromIdb) return fromIdb;
  }catch(e){ console.error("Error leyendo IndexedDB", e); }

  // 2) Migración única: ¿había datos viejos en localStorage de una versión anterior?
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const migrated = JSON.parse(raw);
      await idbSet(IDB_KEY, migrated);
      localStorage.removeItem(STORAGE_KEY);
      return migrated;
    }catch(e){ console.error("Error migrando datos guardados", e); }
  }

  // 3) Primera vez: arrancamos con la última copia conocida.
  return {
    meta: { ...DEFAULT_DATA.meta },
    muro: JSON.parse(JSON.stringify(DEFAULT_DATA.muro || {cover:null, avatar:null, coverAspect:null})),
    rutinaA: JSON.parse(JSON.stringify(DEFAULT_DATA.rutinaA)),
    rutinaB: JSON.parse(JSON.stringify(DEFAULT_DATA.rutinaB)),
    tecnica: JSON.parse(JSON.stringify(DEFAULT_DATA.tecnica)),
    logs: JSON.parse(JSON.stringify(DEFAULT_DATA.logs || EMPTY_LOGS)),
    bloques: JSON.parse(JSON.stringify(DEFAULT_DATA.bloques || [])),
    tracker: DEFAULT_DATA.tracker ? JSON.parse(JSON.stringify(DEFAULT_DATA.tracker)) : null
  };
}
async function saveState(silent){
  STATE.meta.lastUpdate = nowStr();
  STATE.meta.lastUpdateTs = Date.now();
  try{
    await idbSet(IDB_KEY, STATE);
  }catch(e){
    console.error("Error guardando en IndexedDB", e);
    alert("No se pudo guardar (posible falta de espacio). Exportá una copia .json como respaldo.");
    return;
  }
  document.getElementById("lastUpdate").textContent = STATE.meta.lastUpdate;
  if(!silent) flashSaved();
  scheduleDrivePush();
}

// ============================================================
// SINCRONIZACIÓN CON GOOGLE DRIVE
// Guarda una copia de STATE como archivo JSON en el Drive del usuario
// (accesible únicamente por esta app, scope drive.file) para que los
// cambios se vean en cualquier dispositivo sin exportar/importar a mano.
// ============================================================
const DRIVE_CLIENT_ID = "196367232149-jc4vrhs5vfrqcsb1egr1hsn3jusfdhjc.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILENAME = "bitacora_entrenamiento_sync.json";
const DRIVE_TOKEN_KEY = "bitacora_drive_token_v1";

let driveTokenClient = null;
let driveAccessToken = null;   // token vigente en memoria
let driveTokenExpiresAt = 0;   // epoch ms
let driveFileId = null;        // id del archivo en Drive (se busca/crea una vez)
let drivePushTimer = null;
let driveSyncing = false;

function setDriveStatus(text, kind){
  const el = document.getElementById("driveSyncStatus");
  if(!el) return;
  el.textContent = text;
  el.className = "drive-sync-status" + (kind ? " " + kind : "");
}

function driveHasValidToken(){
  return !!driveAccessToken && Date.now() < driveTokenExpiresAt - 30000;
}

function saveDriveTokenCache(){
  try{
    localStorage.setItem(DRIVE_TOKEN_KEY, JSON.stringify({ token: driveAccessToken, expiresAt: driveTokenExpiresAt }));
  }catch(e){}
}
function loadDriveTokenCache(){
  try{
    const raw = localStorage.getItem(DRIVE_TOKEN_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.token && parsed.expiresAt > Date.now() + 30000){
      driveAccessToken = parsed.token;
      driveTokenExpiresAt = parsed.expiresAt;
    }
  }catch(e){}
}

function initDriveAuth(){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    // El script de Google todavía no cargó; reintentar en un momento.
    setTimeout(initDriveAuth, 400);
    return;
  }
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){
        console.error("Error de autenticación Drive:", resp);
        setDriveStatus("☁️ No se pudo conectar (" + resp.error + ")", "err");
        return;
      }
      driveAccessToken = resp.access_token;
      driveTokenExpiresAt = Date.now() + (resp.expires_in ? resp.expires_in*1000 : 3500*1000);
      saveDriveTokenCache();
      updateDriveUiConnected();
      await syncPullAndMerge(true);
    }
  });

  // Intento silencioso: si ya hay un token cacheado vigente, lo usamos directo
  // sin pedirle nada al usuario.
  loadDriveTokenCache();
  if(driveHasValidToken()){
    updateDriveUiConnected();
    syncPullAndMerge(false);
  }
}

function connectDrive(){
  if(!driveTokenClient){ setDriveStatus("☁️ Iniciando…", "warn"); setTimeout(connectDrive, 500); return; }
  driveTokenClient.requestAccessToken({ prompt: driveAccessToken ? "" : "consent" });
}

function updateDriveUiConnected(){
  document.getElementById("driveConnectBtn").style.display = "none";
  document.getElementById("driveSyncNowBtn").style.display = "inline-block";
  setDriveStatus("☁️ Google Drive conectado", "ok");
}

function driveAuthHeaders(){
  return { "Authorization": "Bearer " + driveAccessToken };
}

async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`, {
    headers: driveAuthHeaders()
  });
  if(!res.ok) throw new Error("No se pudo buscar el archivo en Drive (" + res.status + ")");
  const data = await res.json();
  if(data.files && data.files.length > 0) return data.files[0].id;
  return null;
}

async function driveDownloadFile(fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: driveAuthHeaders()
  });
  if(!res.ok) throw new Error("No se pudo descargar el archivo de Drive (" + res.status + ")");
  return await res.json();
}

async function driveCreateFile(content){
  const metadata = { name: DRIVE_FILENAME, mimeType: "application/json" };
  const boundary = "bitacora_boundary_" + Math.random().toString(36).slice(2);
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(content)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { ...driveAuthHeaders(), "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if(!res.ok) throw new Error("No se pudo crear el archivo en Drive (" + res.status + ")");
  const data = await res.json();
  return data.id;
}

async function driveUpdateFile(fileId, content){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { ...driveAuthHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify(content)
  });
  if(!res.ok) throw new Error("No se pudo actualizar el archivo en Drive (" + res.status + ")");
}

function scheduleDrivePush(){
  if(!driveHasValidToken()) return; // no conectado, no hay nada que empujar
  clearTimeout(drivePushTimer);
  drivePushTimer = setTimeout(()=>{ pushToDrive().catch(e=>{
    console.error(e);
    setDriveStatus("☁️ Error al sincronizar", "err");
  }); }, 1800);
}

async function pushToDrive(){
  if(!driveHasValidToken() || driveSyncing) return;
  driveSyncing = true;
  setDriveStatus("☁️ Sincronizando…", "warn");
  try{
    if(!driveFileId) driveFileId = await driveFindFile();
    if(!driveFileId){
      driveFileId = await driveCreateFile(STATE);
    } else {
      await driveUpdateFile(driveFileId, STATE);
    }
    setDriveStatus("☁️ Sincronizado ✓", "ok");
  } finally {
    driveSyncing = false;
  }
}

async function syncPullAndMerge(askIfNewer){
  if(!driveHasValidToken() || driveSyncing) return;
  driveSyncing = true;
  setDriveStatus("☁️ Buscando cambios…", "warn");
  try{
    if(!driveFileId) driveFileId = await driveFindFile();
    if(!driveFileId){
      // Todavía no existe copia en Drive: la creamos con lo que tenemos localmente.
      driveFileId = await driveCreateFile(STATE);
      setDriveStatus("☁️ Sincronizado ✓", "ok");
      return;
    }
    const remote = await driveDownloadFile(driveFileId);
    const remoteTs = (remote && remote.meta && remote.meta.lastUpdateTs) || 0;
    const localTs = (STATE && STATE.meta && STATE.meta.lastUpdateTs) || 0;
    if(remoteTs > localTs){
      const remoteWhen = (remote.meta && remote.meta.lastUpdate) || "desconocida";
      const proceed = !askIfNewer || confirm(
        `Hay una versión más reciente en Google Drive (última edición: ${remoteWhen}).\n\n¿Reemplazar los datos de este dispositivo con esa versión?`
      );
      if(proceed){
        STATE = remote;
        if(!STATE.logs) STATE.logs = JSON.parse(JSON.stringify(EMPTY_LOGS));
        if(!STATE.muro) STATE.muro = {cover:null, avatar:null, coverAspect:null};
        if(STATE.tracker === undefined) STATE.tracker = null;
        await idbSet(IDB_KEY, STATE);
        renderAll();
        setDriveStatus("☁️ Sincronizado ✓ (traído de Drive)", "ok");
        return;
      }
    }
    // Si lo local es igual o más nuevo, empujamos lo local para dejar todo alineado.
    if(localTs >= remoteTs){
      await driveUpdateFile(driveFileId, STATE);
    }
    setDriveStatus("☁️ Sincronizado ✓", "ok");
  } catch(e){
    console.error(e);
    setDriveStatus("☁️ Error al sincronizar", "err");
  } finally {
    driveSyncing = false;
  }
}

function manualSyncDrive(){
  syncPullAndMerge(true);
}

// ---------- video embeds: YouTube / Instagram / TikTok / Drive / archivo directo ----------
function detectVideoPlatform(url){
  try{
    const u = new URL(url);
    const h = u.hostname.replace(/^www\./,"");
    if(h.includes("youtube.com") || h === "youtu.be") return "youtube";
    if(h.includes("instagram.com")) return "instagram";
    if(h.includes("tiktok.com")) return "tiktok";
    if(h.includes("drive.google.com")) return "drive";
    if(/\.(mp4|webm|mov|m3u8)(\?.*)?$/i.test(u.pathname)) return "file";
    return "other";
  }catch(e){ return "other"; }
}
function youtubeEmbedUrl(url){
  let id = null;
  try{
    const u = new URL(url);
    if(u.hostname.replace(/^www\./,"") === "youtu.be") id = u.pathname.slice(1);
    else if(u.searchParams.get("v")) id = u.searchParams.get("v");
    else{
      const m = u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
      if(m) id = m[2];
    }
  }catch(e){}
  return id ? `https://www.youtube.com/embed/${id}` : null;
}
function driveEmbedUrl(url){
  const m = url.match(/\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : null;
}
let _igScriptLoaded = false, _ttScriptLoaded = false;
function ensureEmbedScript(kind){
  if(kind === "instagram" && !_igScriptLoaded){
    _igScriptLoaded = true;
    const s = document.createElement("script");
    s.src = "https://www.instagram.com/embed.js";
    s.async = true;
    document.body.appendChild(s);
  }
  if(kind === "tiktok" && !_ttScriptLoaded){
    _ttScriptLoaded = true;
    const s = document.createElement("script");
    s.src = "https://www.tiktok.com/embed.js";
    s.async = true;
    document.body.appendChild(s);
  }
}
function reprocessEmbeds(){
  if(window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
}
function videoEmbedHtml(v){
  const platform = detectVideoPlatform(v.url);
  if(platform === "youtube"){
    const embed = youtubeEmbedUrl(v.url);
    if(embed) return `<div class="video-embed"><iframe src="${embed}" allowfullscreen loading="lazy" allow="encrypted-media; picture-in-picture"></iframe></div>`;
  }
  if(platform === "drive"){
    const embed = driveEmbedUrl(v.url);
    if(embed) return `<div class="video-embed"><iframe src="${embed}" allow="autoplay" allowfullscreen loading="lazy"></iframe></div>`;
  }
  if(platform === "file"){
    return `<div class="video-embed"><video controls preload="metadata" src="${escapeHtml(v.url)}"></video></div>`;
  }
  if(platform === "instagram"){
    ensureEmbedScript("instagram");
    return `<blockquote class="instagram-media" data-instgrm-permalink="${escapeHtml(v.url)}" data-instgrm-version="14" style="margin:8px 0 0;background:transparent;border:none;"></blockquote>`;
  }
  if(platform === "tiktok"){
    ensureEmbedScript("tiktok");
    return `<blockquote class="tiktok-embed" cite="${escapeHtml(v.url)}" style="margin:8px 0 0;"></blockquote>`;
  }
  return `<div class="video-embed-note">No pude embeber este enlace automáticamente — usá el link de arriba para abrirlo.</div>`;
}

function attachEditableHandlers(container){
  container.querySelectorAll('[contenteditable="true"]').forEach(el=>{

function onEditableBlur(e){
  const el = e.target;
  const card = el.closest('.ex-card');
  if(card){
    const routineKey = card.dataset.routine;
    const idx = parseInt(card.dataset.idx);
    const ex = STATE[routineKey].exercises[idx];
    if(el.dataset.metro){
      if(!ex.metronomo) ex.metronomo = { pulsosCompas:"", clicksPulso:"" };
      ex.metronomo[el.dataset.metro] = el.innerText.trim();
      saveState();
      return;
    }
    const field = el.dataset.field;
    if(field === "notas"){
      ex.notas = el.innerText.trim();
    } else if(field === "notasAclaracion"){
      ex.notasAclaracion = el.innerText.trim();
    } else if(field === "reglasProgresion"){
      ex.reglasProgresion = el.innerText.trim();
    } else if(ex.stats && field in ex.stats){
      ex.stats[field] = el.innerText.trim();
    } else if(field === "nombre"){
      ex.nombre = el.innerText.trim();
    }
    saveState();
    return;
  }
  if(el.dataset.routineField){
    const rk = el.dataset.routine;
    STATE[rk][el.dataset.routineField] = el.innerText.trim();
    saveState();
    return;
  }
  if(el.dataset.field === "regresionA"){
    STATE.rutinaA.regresion = el.innerText.trim();
    saveState();
    return;
  }
  if(el.dataset.key){
    setByPath(STATE, el.dataset.key, el.innerText.trim());
    saveState();
  }
}

function setByPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}

function cycleTag(routineKey, idx){
  const order = ["normal","cardio","priority"];
  const ex = STATE[routineKey].exercises[idx];
  const cur = order.indexOf(ex.tag);
  ex.tag = order[(cur+1)%order.length];
  saveState();
  renderRoutine(routineKey);
}

function changeFase(routineKey, idx, newFase){
  STATE[routineKey].exercises[idx].fase = newFase;
  // reordenar: mover el ejercicio al final del bloque de su nueva fase
  const arr = STATE[routineKey].exercises;
  const moved = arr.splice(idx,1)[0];
  let insertAt = arr.length;
  for(let i=arr.length-1;i>=0;i--){
    if((arr[i].fase||"fuerza") === newFase){ insertAt = i+1; break; }
  }
  // si no hay ningún elemento de esa fase todavía, insertar respetando el orden general de fases
  if(!arr.some(e=>(e.fase||"fuerza")===newFase)){
    const faseIdx = FASE_ORDER.indexOf(newFase);
    insertAt = arr.findIndex(e=>FASE_ORDER.indexOf(e.fase||"fuerza") > faseIdx);
    if(insertAt === -1) insertAt = arr.length;
  }
  arr.splice(insertAt,0,moved);
  saveState();
  renderRoutine(routineKey);
}

function deleteExercise(routineKey, idx){
  if(!confirm("¿Eliminar este ejercicio de la rutina?")) return;
  STATE[routineKey].exercises.splice(idx,1);
  saveState();
  renderRoutine(routineKey);
}

      if(titleEl){ titleEl.focus(); document.execCommand('selectAll', false, null); }
    }
  }, 60);
}

// ============================================================
// TRACKER DE CONSTANCIA — vive dentro de Registro diario.
// Se auto-completa con cada registro guardado en el formulario de abajo
// (matcheando por fecha). Los días sin registro se pueden marcar a mano.
// ============================================================
function isoAddDays(iso, n){
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function trackerDayNum(iso){
  return new Date(iso + "T12:00:00").getDate();
}
function trackerWeekdayShort(iso){
  return new Date(iso + "T12:00:00").toLocaleDateString('es-AR', {weekday:'short'}).replace(/\.$/, "");
}

// Recalcula, para cada día del tracker, si hay un registro diario guardado
// en esa fecha. Si lo hay, el color se deriva de ese registro (auto).
// Si no lo hay, se respeta lo que el usuario haya marcado a mano.
function syncTrackerFromLogs(){
  const t = STATE.tracker;
  if(!t || !t.days) return;
  const byDate = {};
  STATE.logs.daily.forEach(l=>{ byDate[l.date] = l.routine; });
  t.days.forEach((day, i)=>{
    const dateStr = isoAddDays(t.startDate, i);
    day.date = dateStr;
    if(byDate[dateStr] !== undefined){
      day.status = byDate[dateStr];
      day.hasLog = true;
    } else {
      day.hasLog = false;
    }
  });
}

function trackerStatusClass(status){
  if(status === "A" || status === "B") return "status-A";
  if(status === "Descanso") return "status-Descanso";
  if(status === "Otro") return "status-Otro";
  return "";
}

function trackerPercent(){
  const t = STATE.tracker;
  if(!t || !t.days.length) return 0;
  const done = t.days.filter(d=>d.status).length;
  return Math.round((done / t.days.length) * 100);
}

function createOrUpdateTracker(){
  const nombreEl = document.getElementById("trackerNombre");
  const semanasEl = document.getElementById("trackerSemanas");
  const startEl = document.getElementById("trackerStart");
  const nombre = (nombreEl.value || "").trim() || "Ciclo de entrenamiento";
  const semanas = Math.max(1, parseInt(semanasEl.value) || 1);
  const startDate = startEl.value || new Date().toISOString().slice(0,10);
  const totalDays = semanas * 7;

  // Preserva marcas manuales (días sin registro de tarjeta) cuya fecha
  // vuelva a caer dentro del nuevo rango.
  const prevByDate = {};
  if(STATE.tracker && STATE.tracker.days){
    STATE.tracker.days.forEach(d=>{ if(d.date && d.status && !d.hasLog) prevByDate[d.date] = d.status; });
  }

  const days = [];
  for(let i=0;i<totalDays;i++){
    const dateStr = isoAddDays(startDate, i);
    days.push({ date: dateStr, status: prevByDate[dateStr] || null, hasLog:false });
  }

  STATE.tracker = { nombre, semanas, startDate, days };
  syncTrackerFromLogs();
  saveState();
  renderRegistro();
  flashSaved();
}

function cycleTrackerDay(idx){
  const t = STATE.tracker;
  if(!t) return;
  const day = t.days[idx];
  if(day.hasLog){
    alert("Este día ya tiene un registro cargado abajo. Para cambiarle el color, editá o eliminá ese registro.");
    return;
  }
  const order = [null, "A", "Descanso", "Otro"];
  const cur = order.indexOf(day.status);
  day.status = order[(cur+1) % order.length];
  saveState(true);
  renderRegistro();
}

// ============================================================
// MURO — foto de portada + avatar, guardadas como imagen directa
// (no como enlace), comprimidas al subir para no inflar el storage.
// ============================================================
function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("No se pudo leer la imagen"));
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: canvas.toDataURL("image/jpeg", quality), width: w, height: h,
                  naturalWidth: img.width, naturalHeight: img.height });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

}

// ============================================================
// NAVEGACIÓN DE TABS
// ============================================================
// Recuerda en qué scroll (posición vertical, dentro de esa pestaña) quedaste
// la última vez, para que al volver a una pestaña sigas donde la dejaste en
// vez de arrancar siempre desde arriba. Vive solo en memoria de la sesión
// actual (no se guarda en el JSON) — es una comodidad de navegación, no un dato.
const _scrollPositions = {};
let _currentView = "rutinaA"; // coincide con la vista activa por defecto en el HTML

function showView(viewKey){
  if(_currentView){
    _scrollPositions[_currentView] = window.scrollY;
  }
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(`view-${viewKey}`).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-view="${viewKey}"]`).classList.add('active');
  _currentView = viewKey;
  // Restaurar el scroll guardado de esta pestaña. Se espera al siguiente frame
  // para que el navegador ya haya recalculado el alto (la vista pasó de
  // display:none a block recién ahora, así que antes el scrollTo no tendría
  // dónde ir).
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.scrollTo(0, _scrollPositions[viewKey] || 0);
    });
  });
  if(viewKey === "muro"){
    const toggle = document.getElementById("muroCompressToggle");
    if(toggle){
      toggle.classList.remove("muro-toggle-enter");
      void toggle.offsetWidth; // reflow para poder repetir la animación cada vez que se abre
      toggle.classList.add("muro-toggle-enter");
    }
  }
}

// ============================================================
// IMPORT / EXPORT
// ============================================================
function exportJSON(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `bitacora_entrenamiento_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// INIT
// ============================================================
function renderAll(){
  document.getElementById("startDate").textContent = STATE.meta.startDate;
  document.getElementById("cycleName").textContent = STATE.meta.cycleName;
  document.getElementById("lastUpdate").textContent = STATE.meta.lastUpdate || "—";
  renderMuro();
  renderRoutine("rutinaA");
  renderRoutine("rutinaB");
  renderCalentamiento();
  renderTecnica();
  renderRegistro();
  renderSemanal();
}

document.addEventListener("DOMContentLoaded", async ()=>{
  STATE = await loadState();
  if(!STATE.logs) STATE.logs = JSON.parse(JSON.stringify(EMPTY_LOGS));
  if(!STATE.muro) STATE.muro = {cover:null, avatar:null, coverAspect:null};
  if(STATE.tracker === undefined) STATE.tracker = null;
  renderAll();
  initDriveAuth();

  document.getElementById("tabs").addEventListener("click", (e)=>{
    const btn = e.target.closest(".tab-btn");
    if(!btn) return;
    showView(btn.dataset.view);
  });

  document.getElementById("startDate").addEventListener("blur", (e)=>{
    STATE.meta.startDate = e.target.textContent.trim();
    saveState();
  });
  document.getElementById("cycleName").addEventListener("blur", (e)=>{
    STATE.meta.cycleName = e.target.textContent.trim();
    saveState();
  });

  document.getElementById("importFile").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
      try{
        const imported = JSON.parse(evt.target.result);
        if(!confirm("Esto va a reemplazar todos los datos actuales con la copia importada. ¿Continuar?")) return;
        STATE = imported;
        if(!STATE.logs) STATE.logs = JSON.parse(JSON.stringify(EMPTY_LOGS));
        if(!STATE.muro) STATE.muro = {cover:null, avatar:null, coverAspect:null};
        if(STATE.tracker === undefined) STATE.tracker = null;
        saveState(true);
        renderAll();
        flashSaved();
      }catch(err){
        alert("No se pudo leer el archivo. Verificá que sea una copia exportada desde esta misma bitácora.");
      }
    };
    reader.readAsText(file);
  });
});

</script>
